<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noughts and Crosses</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/favicon.ico">
</head>
<body>
    <h1>Noughts and Crosses</h1>

    <div class="board-container">
      <div class="board">
        <div><p id="1" onclick="handleClick(this.id)">x</p></div>
        <div><p id="2">x</p></div>
        <div><p id="3">x</p></div>
        <div><p id="4">x</p></div>
        <div><p id="5">x</p></div>
        <div><p id="6">x</p></div>
        <div><p id="7">x</p></div>
        <div><p id="8">x</p></div>
        <div><p id="9">x</p></div>
      </div>
    </div>

    <div class="player-form">
      <form class="input-players" method="post">
        <label for="player1">Player 1:</label>
        <input type="text" id="player1-input" name="player1"><br><br>
        <label for="player2">Player 2:</label>
        <input type="text" id="player2-input" name="player2"><br><br>
        <input type="submit" value="Submit">
      </form>
    </div>

    <div class="scoreboard">
      <h3>Let battle commence!</h3>
      <p><span id="player1">Player 1</span>: <span id="player1-score">0</span></p>
      <p><span id="player2">Player 2</span>: <span id="player2-score">0</span></p>
    </div>

<script src="main.js"></script>
</body>
</html>
