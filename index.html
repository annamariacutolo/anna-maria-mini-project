<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noughts and Crosses</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/favicon.ico">
</head>
<body>
  <div class="body">
    <h1>Noughts and Crosses</h1>

    <div class="board-container">
      <div class="board">
        <div id="1"></div>
        <div id="2"></div>
        <div id="3"></div>
        <div id="4"></div>
        <div id="5"></div>
        <div id="6"></div>
        <div id="7"></div>
        <div id="8"></div>
        <div id="9"></div>
      </div>
    </div>

    <div class="input-error">
      <h3>Please input player names.</h3>
    </div>

    <div class="player-form">
      <form class="input-players" method="post">
        <label for="player1">Player 1:</label>
        <input type="text" id="player1-input" name="player1"><br><br>
        <label for="player2">Player 2:</label>
        <input type="text" id="player2-input" name="player2"><br><br>
        <input type="submit" id="submit-btn" value="Submit">
      </form>
    </div>

    <div class="scoreboard">
      <h3>Let battle commence!</h3>
      <div>
        <p><span id="player1">Player 1</span>: <span id="player1-score">0</span></p>
        <p><span id="player2">Player 2</span>: <span id="player2-score">0</span></p>
        <button type="button" id="button">Reset</button>
      </div>
    </div>
  </div>
<script src="main.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@3.0.3/tsparticles.confetti.bundle.min.js"></script>
</body>
</html>
